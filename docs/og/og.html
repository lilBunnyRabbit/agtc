<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css" rel="stylesheet">
<style>
:root {
  --bg-darkest: oklch(0.153 0.014 230.47); --bg-darker: oklch(0.187 0.0171 230.47); --bg-dark: oklch(0.221 0.0202 230.47);
  --bg: oklch(0.255 0.0233 230.47); --bg-light: oklch(0.289 0.0264 230.47); --bg-lighter: oklch(0.323 0.0295 230.47);
  --bg-lightest: oklch(0.357 0.0326 230.47); --fg: oklch(0.745 0.0078 50.47); --dim: oklch(0.745 0.0078 50.47 / 0.55);
  --primary: oklch(0.745 0.0699 122.47); --secondary: oklch(0.745 0.0466 302.47); --accent: oklch(0.745 0.0932 50.47);
  --tertiary: oklch(0.745 0.0233 176.47); --cottontail: oklch(0.949 0.0939 122.47);
  --mono: Hack, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg-darkest); font-family: Inter, sans-serif; color: var(--fg); position: relative; }
.ears { fill: var(--primary); }
.cot { color: var(--cottontail); }
.glow { position: absolute; inset: 0; pointer-events: none; }

.glow { background: radial-gradient(40% 55% at 71% 50%, oklch(0.745 0.0699 122.47 / 0.10), transparent 70%); }
.scope { position: absolute; left: 850px; top: 315px; transform: translate(-50%, -50%); width: 520px; height: 520px; border-radius: 50%; border: 2px solid oklch(0.745 0.0699 122.47 / 0.5); background: repeating-radial-gradient(circle, transparent 0 64px, oklch(0.745 0.0699 122.47 / 0.22) 64px 65.5px); overflow: hidden; }
.scope::before, .scope::after { content: ""; position: absolute; background: oklch(0.745 0.0699 122.47 / 0.22); }
.scope::before { left: 50%; top: 0; bottom: 0; width: 1.5px; } .scope::after { top: 50%; left: 0; right: 0; height: 1.5px; }
.sweep { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, oklch(0.745 0.0699 122.47 / 0.35), transparent 70deg); }
.blip { position: absolute; transform: translate(-6px, -6px); display: flex; align-items: center; gap: 8px; }
.blip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 5px color-mix(in oklch, var(--c) 25%, transparent), 0 0 18px var(--c); }
.blip span { font: 600 14px var(--mono); color: var(--c); background: oklch(0.153 0.014 230.47 / 0.8); padding: 1px 6px; border-radius: 4px; }
.left { position: absolute; left: 76px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.left .ears { width: 80px; }
h1 { font-size: 120px; font-weight: 800; color: var(--cottontail); line-height: 0.95; }
.sub { font-size: 32px; font-weight: 500; line-height: 1.25; }
.sub b { color: var(--primary); }
.feat { font: 16px var(--mono); color: var(--dim); }

</style></head><body>
