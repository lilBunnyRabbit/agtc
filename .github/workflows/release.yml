name: release

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret.
# One-time setup on npmjs.com: package agtc → Settings → Trusted Publisher →
# GitHub Actions, owner lilBunnyRabbit, repository agtc, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run smoke

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${pkg}"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest && npm --version

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
