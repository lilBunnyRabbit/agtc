name: release

# Publishes to npm via trusted publishing (OIDC) — no NPM_TOKEN secret.
# One-time setup on npmjs.com: package @lilbunnyrabbit/agtc → Settings → Trusted Publisher →
# GitHub Actions, owner lilBunnyRabbit, repository agtc, workflow release.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:offline
      - run: bun run smoke

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${pkg}"; exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # trusted publishing needs npm >= 11.5.1; npm 12 rejects the runner node version
      - run: npm install -g npm@11 && npm --version

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
